name: Validate Skills

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "template/**"
      - "scripts/**"
  pull_request:
    branches: [main]
    paths:
      - "skills/**"
      - "template/**"
      - "scripts/**"

jobs:
  validate:
    name: Validate skill files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run skill validator
        run: node scripts/validate-skills.mjs --verbose